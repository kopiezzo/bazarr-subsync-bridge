name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [^[:space:]].*[^.]$'
          if [[ ! $TITLE =~ $pattern ]] || (( ${#TITLE} > 72 )); then
            echo "Pull request title must be 'type(scope): summary', at most 72 characters, no trailing period: $TITLE" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell check
        run: shellcheck bazarr-postprocess.sh

      - name: Compose configuration
        run: docker compose config --quiet

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/kopiezzo/bazarr-subsync-bridge:latest
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64

      - name: Sync a subtitle through the queue
        run: |
          set -euo pipefail
          mkdir -p queue logs media
          export MEDIA_HOST_PATH="$PWD/media" PUID="$(id -u)" PGID="$(id -g)"
          printf 'SUBSYNC_EFFORT=0.5\nSUBSYNC_MIN_CORRELATION=0.1\n' > .env
          python3 tests/make_subtitles.py media/reference.srt media/episode.srt

          docker compose up -d --no-build
          trap 'docker compose logs; docker compose down -v' EXIT

          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' subsync)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' subsync)" = healthy

          before=$(sha256sum media/episode.srt)
          printf '{"video": "/media/reference.srt", "subtitle": "/media/episode.srt", "subtitle_lang": "eng", "video_lang": "eng"}' > queue/job-1-1.json.tmp
          mv queue/job-1-1.json.tmp queue/job-1-1.json
          for _ in $(seq 120); do
            [ -e queue/job-1-1.json ] || break
            sleep 1
          done
          test ! -e queue/job-1-1.json
          grep -q 'Synchronized: /media/episode.srt' logs/bridge.log
          test "$(sha256sum media/episode.srt)" != "$before"
          test -z "$(find media -name '.*')"

          docker compose exec subsync sh -c 'touch /cache/write-test'
          docker compose stop -t 30
          grep -q 'Stopped by signal' logs/bridge.log
