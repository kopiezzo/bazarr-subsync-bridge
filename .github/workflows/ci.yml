name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n subsync-monitor.sh
          bash -n subsync-wrapper.sh
          bash -n bazarr-postprocess.sh

      - name: Docker build
        run: docker build --build-arg PUID="$(id -u)" --build-arg PGID="$(id -g)" -t bazarr-subsync-bridge .

      - name: SubSync smoke test
        run: |
          docker run --rm --entrypoint python bazarr-subsync-bridge -c 'import gizmo'
          docker run --rm --entrypoint subsync bazarr-subsync-bridge --version

          mkdir -p "$RUNNER_TEMP/subsync-smoke"
          python3 - <<'PY'
          from pathlib import Path
          import os

          output_dir = Path(os.environ['RUNNER_TEMP']) / 'subsync-smoke'
          phrases = [
              'The river runs beneath the bridge.',
              'A red bicycle waits by the gate.',
              'Please close the window before sunset.',
              'The library opens at nine tomorrow.',
              'Fresh bread is cooling in the kitchen.',
              'Our train leaves from platform seven.',
              'The old lighthouse overlooks the harbor.',
              'Three small birds landed on the roof.',
              'We found the missing key this morning.',
              'The garden needs water after the heat.',
          ]

          def srt(offset):
              cues = []
              for index, phrase in enumerate(phrases, start=1):
                  start = index * 4 + offset
                  cues.append(
                      f'{index}\n'
                      f'00:00:{start:02d},000 --> 00:00:{start + 2:02d},000\n'
                      f'{phrase}\n'
                  )
              return '\n'.join(cues)

          (output_dir / 'reference.srt').write_text(srt(0))
          (output_dir / 'shifted.srt').write_text(srt(2))
          PY

          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/subsync-smoke:/smoke" \
            --entrypoint subsync bazarr-subsync-bridge \
            --cli sync --sub /smoke/shifted.srt --ref /smoke/reference.srt \
            --out /smoke/output.srt --effort=0.1 --min-correlation=0.1 --min-points-no=5
          test -s "$RUNNER_TEMP/subsync-smoke/output.srt"

      - name: Compose startup and health check
        run: |
          smoke_dir="$RUNNER_TEMP/subsync-compose"
          mkdir -p "$smoke_dir/media" "$smoke_dir/queue" "$smoke_dir/logs"
          export MEDIA_HOST_PATH="$smoke_dir/media"
          export QUEUE_HOST_PATH="$smoke_dir/queue"
          export LOGS_HOST_PATH="$smoke_dir/logs"
          export PUID="$(id -u)" PGID="$(id -g)"

          docker compose config --quiet
          docker compose up -d --no-build
          trap 'docker compose down' EXIT
          docker exec subsync sh -c 'test -w /queue && test -w /logs'

          health_cmd=$(docker image inspect bazarr-subsync-bridge --format '{{index .Config.Healthcheck.Test 1}}')
          docker exec subsync sh -c "$health_cmd"
          docker exec subsync supervisorctl -c /etc/supervisor/conf.d/subsync.conf stop subsync-monitor
          if docker exec subsync sh -c "$health_cmd"; then
            echo 'Health check reported success with the monitor stopped' >&2
            exit 1
          fi
          docker exec subsync supervisorctl -c /etc/supervisor/conf.d/subsync.conf start subsync-monitor
          docker exec subsync sh -c "$health_cmd"
