services:
  subsync:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: bazarr-subsync-bridge:latest
    container_name: subsync
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: ${QUEUE_HOST_PATH:-./queue}
        target: /queue
        bind:
          create_host_path: false
      - type: bind
        source: ${LOGS_HOST_PATH:-./logs}
        target: /logs
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_HOST_PATH:-./media}
        target: ${MEDIA_CONTAINER_PATH:-/media}
        bind:
          create_host_path: false
