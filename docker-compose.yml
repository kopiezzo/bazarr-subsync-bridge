services:
  subsync:
    image: ghcr.io/kopiezzo/bazarr-subsync-bridge:${BRIDGE_VERSION:-latest}
    build: .
    container_name: subsync
    restart: unless-stopped
    init: true
    # The bridge stops SubSync and waits up to 10 s for it before exiting
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: ${QUEUE_HOST_PATH:-./queue}
        target: /queue
        bind:
          create_host_path: false
      - type: bind
        source: ${LOGS_HOST_PATH:-./logs}
        target: /logs
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_HOST_PATH:-./media}
        target: ${MEDIA_CONTAINER_PATH:-/media}
        bind:
          create_host_path: false
      - type: volume
        source: cache
        target: /cache

volumes:
  cache:
